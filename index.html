<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sentry — Live Vision</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #0b0f0e;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    padding: 24px;
}

.app {
    width: 100%;
    max-width: 1100px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.title {
    font-size: 28px;
    font-weight: 700;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: #151c1a;
    font-size: 14px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
}

.status.online .status-dot {
    background: #35d07f;
}

.camera {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #050707;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #26302d;
}

.camera img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #050707;
}

.loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca8a4;
    pointer-events: none;
}

.info {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card {
    background: #111715;
    border: 1px solid #26302d;
    border-radius: 16px;
    padding: 16px;
}

.card-title {
    color: #8d9995;
    font-size: 13px;
    margin-bottom: 7px;
}

.card-value {
    font-size: 18px;
    font-weight: 600;
}

@media (max-width: 700px) {

    body {
        padding: 12px;
    }

    .header {
        margin-bottom: 12px;
    }

    .title {
        font-size: 22px;
    }

    .camera {
        border-radius: 14px;
    }

    .info {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<div class="app">

```
<div class="header">

    <div class="title">
        Sentry
    </div>

    <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Connecting...</span>
    </div>

</div>


<div class="camera">

    <img
        id="stream"
        alt="Live ESP32-CAM stream"
    >

    <div
        class="loading"
        id="loading"
    >
        Connecting to camera...
    </div>

</div>


<div class="info">

    <div class="card">
        <div class="card-title">
            CAMERA
        </div>

        <div class="card-value">
            ESP32-CAM
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            AI
        </div>

        <div class="card-value">
            YOLO Detection
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            STREAM
        </div>

        <div
            class="card-value"
            id="streamState"
        >
            Connecting...
        </div>
    </div>

</div>
```

</div>

<script>

const STREAM_URL =
    "https://stream-flask-cdv9.onrender.com/frame";

const img =
    document.getElementById("stream");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const loading =
    document.getElementById("loading");

const streamState =
    document.getElementById("streamState");


let timer = null;


/*
    Because /frame returns the newest JPEG,
    repeatedly request it with a cache-busting
    parameter.
*/

function loadFrame() {

    const url =
        STREAM_URL +
        "?t=" +
        Date.now();

    img.onload = function () {

        loading.style.display = "none";

        status.classList.add("online");

        statusText.textContent =
            "Live";

        streamState.textContent =
            "Connected";

        /*
            Immediately request the next frame.
        */

        timer = setTimeout(
            loadFrame,
            80
        );
    };


    img.onerror = function () {

        status.classList.remove("online");

        statusText.textContent =
            "Offline";

        streamState.textContent =
            "Disconnected";

        loading.textContent =
            "Camera unavailable";

        loading.style.display =
            "flex";


        /*
            Retry after a short delay.
        */

        timer = setTimeout(
            loadFrame,
            1000
        );
    };


    img.src = url;
}


loadFrame();

</script>

</body>
</html>
